# Mosquitto Broker Configuration - Smart Irrigation System
# =========================================================

# 1. Listener binding:
# Default to binding to 127.0.0.1 to prevent unauthorized access from other devices on the LAN.
# If ESP32 is a physical board on the LAN, change 127.0.0.1 to 0.0.0.0 or the host's specific LAN IP,
# and ensure firewall rules and authentication are strictly enforced.
listener 1883 127.0.0.1

# 2. Strict Authentication:
# Disallow anonymous connections. All clients must supply valid username and password.
allow_anonymous false

# 3. Password file:
# Path to the password file created with mosquitto_passwd.
# Run: mosquitto_passwd -c password.txt <username>
password_file mosquitto/password.txt

# 4. Persistence:
persistence true
persistence_location mosquitto/data/

# 5. Logging:
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

