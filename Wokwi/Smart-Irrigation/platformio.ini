[platformio]
default_envs = esp32dev

; Wokwi: mô phỏng động học đất (bơm chạy thì ẩm lên).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DSIMULATE_SOIL_DYNAMICS=1
lib_deps =
    marcoschwartz/LiquidCrystal_I2C
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    madhephaestus/ESP32Servo
    knolleary/PubSubClient

; Board thật: đọc trực tiếp cảm biến ẩm, không mô phỏng.
[env:board]
extends = env:esp32dev
build_flags = -DSIMULATE_SOIL_DYNAMICS=0
